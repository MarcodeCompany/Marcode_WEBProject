<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Artikel | Marcode</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f4f4;
            --surface: #ffffff;
            --text-color: #111111;
            --muted: #666666;
            --border-color: #dcdcdc;
            --danger: #d93025;
            --success: #188038;
            --font-display: 'Syne', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-body);
            line-height: 1.5;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Topbar */
        .admin-topbar {
            background: var(--text-color);
            color: #fff;
            padding: 14px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .admin-topbar-inner {
            max-width: 1320px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .admin-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
        }

        .admin-brand img {
            height: 32px;
            width: auto;
            filter: brightness(0) invert(1);
        }

        .admin-badge {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 3px 9px;
            background: rgba(255, 255, 255, 0.16);
            border-radius: 20px;
            font-weight: 600;
            white-space: nowrap;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .admin-user-email {
            font-size: 0.8rem;
            opacity: 0.75;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 18px;
            border-radius: 50px;
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            border: 1px solid var(--text-color);
            background: var(--text-color);
            color: #fff;
            white-space: nowrap;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-outline {
            background: #fff;
            color: var(--text-color);
            border-color: var(--border-color);
        }

        .btn-outline:hover {
            border-color: var(--text-color);
            background: #f5f5f5;
        }

        .btn-light {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.25);
            padding: 7px 14px;
            font-size: 0.78rem;
        }

        .btn-light:hover {
            background: #fff;
            color: #111;
        }

        .btn-danger {
            background: #fff;
            color: var(--danger);
            border-color: #f1c1be;
        }

        .btn-danger:hover {
            background: var(--danger);
            color: #fff;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.78rem;
            border-radius: 6px;
        }

        /* Container */
        .admin-container {
            max-width: 1320px;
            margin: 0 auto;
            padding: 28px 20px 60px;
        }

        /* Login Card */
        .login-wrapper {
            max-width: 420px;
            margin: 40px auto;
            background: var(--surface);
            padding: 32px 24px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        }

        .login-wrapper h1 {
            font-family: var(--font-display);
            font-size: 1.6rem;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .login-wrapper p {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        /* Forms */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.8rem;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .form-group .hint {
            display: block;
            font-size: 0.75rem;
            color: var(--muted);
            font-weight: 400;
            text-transform: none;
            letter-spacing: 0;
            margin-top: 2px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="url"],
        select,
        textarea {
            width: 100%;
            max-width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: var(--font-body);
            font-size: 16px; /* Prevents iOS auto-zoom on focus */
            background: #fff;
            color: var(--text-color);
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--text-color);
        }

        /* Dashboard Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
            gap: 24px;
            align-items: start;
        }

        .panel-card {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            min-width: 0;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding-bottom: 14px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .panel-header h2 {
            font-family: var(--font-display);
            font-size: 1.2rem;
            text-transform: uppercase;
        }

        .form-row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        /* Editor Toolbar */
        .editor-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px;
            background: #f7f7f7;
            border: 1px solid var(--border-color);
            border-bottom: none;
            border-radius: 8px 8px 0 0;
        }

        .toolbar-btn {
            padding: 6px 10px;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-color);
        }

        .toolbar-btn:hover {
            background: var(--text-color);
            color: #fff;
        }

        #article-content {
            border-top-left-radius: 0;
            border-top-right-radius: 0;
            min-height: 240px;
            line-height: 1.6;
            resize: vertical;
        }

        /* Image Upload / Preview */
        .image-upload-row {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }

        .upload-btn-label {
            margin: 0 !important;
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 8px;
            padding: 10px 16px;
        }

        .image-preview-box {
            margin-top: 10px;
            width: 100%;
            height: 170px;
            border-radius: 8px;
            border: 1px dashed var(--border-color);
            background-size: cover;
            background-position: center;
            display: none;
        }

        /* Form Submit Row */
        .form-submit-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        /* Checkbox Toggle */
        .checkbox-label {
            display: inline-flex !important;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-weight: 600 !important;
            font-size: 0.88rem !important;
            text-transform: none !important;
            user-select: none;
            margin-bottom: 0 !important;
        }

        .checkbox-label input {
            width: 18px;
            height: 18px;
            accent-color: var(--text-color);
            flex-shrink: 0;
        }

        /* Article List Items */
        .article-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .article-item {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: border-color 0.2s;
        }

        .article-item:hover {
            border-color: var(--text-color);
        }

        .article-item-info h3 {
            font-size: 0.98rem;
            margin-bottom: 6px;
            line-height: 1.35;
            word-break: break-word;
        }

        .article-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            font-size: 0.76rem;
            color: var(--muted);
        }

        .status-pill {
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        .status-pill.published {
            background: #e6f4ea;
            color: var(--success);
        }

        .status-pill.draft {
            background: #fef7e0;
            color: #b06000;
        }

        .article-item-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding-top: 8px;
            border-top: 1px solid #f0f0f0;
        }

        .article-item-actions .btn-sm {
            flex: 1;
            text-align: center;
        }

        /* Alerts */
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.88rem;
            margin-bottom: 18px;
            display: none;
            word-break: break-word;
        }

        .alert.error {
            background: #fce8e6;
            color: var(--danger);
            border: 1px solid #f5c2c0;
            display: block;
        }

        .alert.success {
            background: #e6f4ea;
            color: var(--success);
            border: 1px solid #ceead6;
            display: block;
        }

        /* --- RESPONSIVE MOBILE & TABLET --- */
        @media (max-width: 960px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 640px) {
            .admin-topbar {
                padding: 12px 16px;
            }

            .admin-brand img {
                height: 26px;
            }

            .admin-user-email {
                display: none; /* Hide email text on small screens to keep topbar clean */
            }

            .admin-container {
                padding: 16px 14px 48px;
            }

            .login-wrapper {
                margin: 20px auto;
                padding: 24px 18px;
            }

            .panel-card {
                padding: 18px 16px;
            }

            .form-row-2 {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .image-upload-row {
                flex-direction: column;
            }

            .upload-btn-label {
                width: 100%;
            }

            .editor-toolbar {
                gap: 4px;
                padding: 6px;
            }

            .toolbar-btn {
                flex: 1 1 calc(33.33% - 6px);
                text-align: center;
                padding: 8px 6px;
                font-size: 0.75rem;
            }

            .form-submit-row {
                flex-direction: column;
                align-items: stretch;
            }

            .form-submit-row .btn {
                width: 100%;
                padding: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- Topbar -->
    <header class="admin-topbar">
        <div class="admin-topbar-inner">
            <a href="index.html" class="admin-brand">
                <img src="images/marcodelogo01.svg" alt="Marcode" onerror="this.style.display='none'">
                <span class="admin-badge">CMS Admin</span>
            </a>
            <div class="topbar-actions">
                <span id="admin-user-email" class="admin-user-email"></span>
                <a href="blog.html" class="btn btn-light" target="_blank">Lihat Blog ↗</a>
                <button type="button" id="btn-logout" class="btn btn-light" style="display: none;">Logout</button>
            </div>
        </div>
    </header>

    <div class="admin-container">

        <!-- Global Alert -->
        <div id="global-alert" class="alert"></div>

        <!-- VIEW 1: LOGIN FORM -->
        <div id="login-view" class="login-wrapper">
            <h1>Login Admin</h1>
            <p>Masuk menggunakan akun Admin untuk membuat dan mengelola artikel Marcode.</p>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email Admin</label>
                    <input type="email" id="login-email" placeholder="admin@marcode.id" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" id="btn-login" class="btn" style="width: 100%; padding: 14px;">
                    Masuk ke Dashboard
                </button>
            </form>
        </div>

        <!-- VIEW 2: ADMIN DASHBOARD -->
        <div id="dashboard-view" class="dashboard-grid" style="display: none;">

            <!-- Left Column: Create / Edit Form -->
            <div class="panel-card">
                <div class="panel-header">
                    <h2 id="form-title">Buat Artikel Baru</h2>
                    <button type="button" id="btn-cancel-edit" class="btn btn-outline btn-sm" style="display: none;">
                        ✕ Batal Edit
                    </button>
                </div>

                <form id="article-form">
                    <input type="hidden" id="article-id">

                    <div class="form-group">
                        <label for="article-title">Judul Artikel *</label>
                        <input type="text" id="article-title" placeholder="Contoh: Strategi Meta Ads 2026 untuk Scale Up Brand" required>
                    </div>

                    <div class="form-row-2">
                        <div class="form-group">
                            <label for="article-slug">Slug URL *</label>
                            <input type="text" id="article-slug" placeholder="strategi-meta-ads-2026" required>
                        </div>
                        <div class="form-group">
                            <label for="article-category">Kategori</label>
                            <input type="text" id="article-category" list="category-list" value="Digital Marketing" required>
                            <datalist id="category-list">
                                <option value="Digital Marketing">
                                <option value="Meta Ads">
                                <option value="Web Development">
                                <option value="SEO Optimization">
                                <option value="Analytics & Tracking">
                                <option value="Case Study">
                            </datalist>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="article-image">
                            Gambar Thumbnail
                            <span class="hint">Tempel link gambar atau upload langsung dari HP/Laptop</span>
                        </label>
                        <div class="image-upload-row">
                            <input type="url" id="article-image" placeholder="https://images.unsplash.com/...">
                            <label class="btn btn-outline upload-btn-label">
                                📁 Upload Gambar
                                <input type="file" id="article-image-file" accept="image/*" style="display: none;">
                            </label>
                        </div>
                        <div id="image-preview" class="image-preview-box"></div>
                    </div>

                    <div class="form-group">
                        <label for="article-excerpt">Ringkasan Singkat (Excerpt) *</label>
                        <textarea id="article-excerpt" rows="2" placeholder="Ringkasan 1-2 kalimat yang tampil di kartu daftar artikel..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="article-content">
                            Isi Artikel *
                            <span class="hint">Tulis paragraf biasa atau gunakan tombol format di bawah</span>
                        </label>
                        <div class="editor-toolbar">
                            <button type="button" class="toolbar-btn" data-tag="h3">Subjudul</button>
                            <button type="button" class="toolbar-btn" data-tag="bold"><b>B</b> Tebal</button>
                            <button type="button" class="toolbar-btn" data-tag="italic"><i>I</i> Miring</button>
                            <button type="button" class="toolbar-btn" data-tag="ul">• List</button>
                            <button type="button" class="toolbar-btn" data-tag="quote">❝ Kutipan</button>
                            <button type="button" class="toolbar-btn" data-tag="link">🔗 Link</button>
                        </div>
                        <textarea id="article-content" placeholder="Tulis isi artikel di sini..." required></textarea>
                    </div>

                    <div class="form-submit-row">
                        <label class="checkbox-label">
                            <input type="checkbox" id="article-published" checked>
                            Langsung Publish ke Website
                        </label>

                        <button type="submit" id="btn-save-article" class="btn" style="padding: 12px 28px;">
                            🚀 Publish Artikel
                        </button>
                    </div>
                </form>
            </div>

            <!-- Right Column: Existing Articles -->
            <div class="panel-card">
                <div class="panel-header">
                    <h2>Daftar Artikel</h2>
                    <button type="button" id="btn-refresh-list" class="btn btn-outline btn-sm">↻ Refresh</button>
                </div>
                <div id="admin-articles-list" class="article-list">
                    <p style="color: var(--muted); font-size: 0.9rem;">Memuat daftar artikel...</p>
                </div>
            </div>

        </div>

    </div>

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const globalAlert = document.getElementById('global-alert');
            const loginView = document.getElementById('login-view');
            const dashboardView = document.getElementById('dashboard-view');
            const btnLogout = document.getElementById('btn-logout');
            const adminUserEmail = document.getElementById('admin-user-email');

            function showAlert(message, type = 'error') {
                globalAlert.textContent = message;
                globalAlert.className = `alert ${type}`;
                window.scrollTo({ top: 0, behavior: 'smooth' });
                setTimeout(() => {
                    globalAlert.className = 'alert';
                }, 6000);
            }

            // Helper: Auto-slug from title
            const titleInput = document.getElementById('article-title');
            const slugInput = document.getElementById('article-slug');
            const idInput = document.getElementById('article-id');

            titleInput.addEventListener('input', () => {
                if (!idInput.value) {
                    slugInput.value = titleInput.value
                        .toLowerCase()
                        .replace(/[^a-z0-9\s-]/g, '')
                        .trim()
                        .replace(/\s+/g, '-')
                        .replace(/-+/g, '-');
                }
            });

            // Image Preview & Upload
            const imageInput = document.getElementById('article-image');
            const imageFileInput = document.getElementById('article-image-file');
            const imagePreview = document.getElementById('image-preview');

            function updateImagePreview(url) {
                if (url && url.startsWith('http')) {
                    imagePreview.style.display = 'block';
                    imagePreview.style.backgroundImage = `url('${url}')`;
                } else {
                    imagePreview.style.display = 'none';
                    imagePreview.style.backgroundImage = 'none';
                }
            }

            imageInput.addEventListener('input', () => updateImagePreview(imageInput.value.trim()));

            imageFileInput.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!supabaseClient) return;

                const ext = file.name.split('.').pop();
                const fileName = `${Date.now()}-${Math.random().toString(36).substring(2, 8)}.${ext}`;

                try {
                    showAlert('Mengupload gambar...', 'success');
                    const { error } = await supabaseClient.storage
                        .from('article-images')
                        .upload(fileName, file, { cacheControl: '3600', upsert: false });

                    if (error) throw error;

                    const { data: publicUrlData } = supabaseClient.storage
                        .from('article-images')
                        .getPublicUrl(fileName);

                    imageInput.value = publicUrlData.publicUrl;
                    updateImagePreview(publicUrlData.publicUrl);
                    showAlert('Gambar berhasil diupload!', 'success');
                } catch (err) {
                    showAlert('Gagal upload gambar: ' + err.message, 'error');
                }
            });

            // Formatting Toolbar
            const contentArea = document.getElementById('article-content');
            document.querySelectorAll('.toolbar-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const tag = btn.dataset.tag;
                    const start = contentArea.selectionStart;
                    const end = contentArea.selectionEnd;
                    const selected = contentArea.value.substring(start, end) || 'Teks di sini';
                    let replacement = '';

                    if (tag === 'h3') replacement = `\n<h3>${selected}</h3>\n`;
                    else if (tag === 'bold') replacement = `<strong>${selected}</strong>`;
                    else if (tag === 'italic') replacement = `<em>${selected}</em>`;
                    else if (tag === 'ul') replacement = `\n<ul>\n  <li>${selected}</li>\n  <li>Poin kedua</li>\n</ul>\n`;
                    else if (tag === 'quote') replacement = `\n<blockquote>${selected}</blockquote>\n`;
                    else if (tag === 'link') {
                        const url = prompt('Masukkan URL Link:', 'https://');
                        if (!url) return;
                        replacement = `<a href="${url}" target="_blank">${selected}</a>`;
                    }

                    contentArea.value =
                        contentArea.value.substring(0, start) +
                        replacement +
                        contentArea.value.substring(end);
                    contentArea.focus();
                });
            });

            function normalizeContentToHtml(raw) {
                const trimmed = raw.trim();
                if (trimmed.includes('<p>') || trimmed.includes('<h3>') || trimmed.includes('<ul>')) {
                    return trimmed
                        .split(/\n\s*\n/)
                        .map(block => {
                            const b = block.trim();
                            if (!b) return '';
                            if (/^<(h[1-6]|ul|ol|p|blockquote|div)/i.test(b)) return b;
                            return `<p>${b.replace(/\n/g, '<br>')}</p>`;
                        })
                        .join('\n');
                }
                return trimmed
                    .split(/\n\s*\n/)
                    .map(p => `<p>${p.trim().replace(/\n/g, '<br>')}</p>`)
                    .join('\n');
            }

            // Auth & Session Management
            async function checkSession() {
                if (!supabaseClient) {
                    loginView.style.display = 'block';
                    dashboardView.style.display = 'none';
                    return;
                }

                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session && session.user) {
                    loginView.style.display = 'none';
                    dashboardView.style.display = 'grid';
                    btnLogout.style.display = 'inline-flex';
                    adminUserEmail.textContent = session.user.email;
                    loadAdminArticles();
                } else {
                    loginView.style.display = 'block';
                    dashboardView.style.display = 'none';
                    btnLogout.style.display = 'none';
                    adminUserEmail.textContent = '';
                }
            }

            // Login Handler
            document.getElementById('login-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!supabaseClient) return;

                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value;
                const btnLogin = document.getElementById('btn-login');

                btnLogin.disabled = true;
                btnLogin.textContent = 'Memverifikasi...';

                const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

                btnLogin.disabled = false;
                btnLogin.textContent = 'Masuk ke Dashboard';

                if (error) {
                    showAlert('Login gagal: ' + error.message, 'error');
                    return;
                }

                showAlert('Berhasil login!', 'success');
                checkSession();
            });

            // Logout Handler
            btnLogout.addEventListener('click', async () => {
                if (supabaseClient) {
                    await supabaseClient.auth.signOut();
                }
                checkSession();
            });

            // Load Articles in Admin
            const adminListEl = document.getElementById('admin-articles-list');

            async function loadAdminArticles() {
                if (!supabaseClient) return;
                adminListEl.innerHTML = '<p style="color: var(--muted); font-size: 0.9rem;">Memuat daftar artikel...</p>';

                const { data, error } = await supabaseClient
                    .from('articles')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    adminListEl.innerHTML = `<p style="color: var(--danger); font-size: 0.9rem;">Error: ${error.message}</p>`;
                    return;
                }

                if (!data || data.length === 0) {
                    adminListEl.innerHTML = '<p style="color: var(--muted); font-size: 0.9rem;">Belum ada artikel.</p>';
                    return;
                }

                adminListEl.innerHTML = data.map(art => `
                    <div class="article-item">
                        <div class="article-item-info">
                            <h3>${art.title}</h3>
                            <div class="article-meta">
                                <span class="status-pill ${art.published ? 'published' : 'draft'}">
                                    ${art.published ? 'Published' : 'Draft'}
                                </span>
                                <span>• ${art.category || 'Umum'}</span>
                                <span>• ${formatArticleDate(art.created_at)}</span>
                            </div>
                        </div>
                        <div class="article-item-actions">
                            <a href="article.html?slug=${encodeURIComponent(art.slug)}" target="_blank" class="btn btn-outline btn-sm">Lihat</a>
                            <button type="button" class="btn btn-outline btn-sm btn-edit" data-id="${art.id}">Edit</button>
                            <button type="button" class="btn btn-danger btn-sm btn-delete" data-id="${art.id}" data-title="${art.title.replace(/"/g, '&quot;')}">Hapus</button>
                        </div>
                    </div>
                `).join('');

                adminListEl.querySelectorAll('.btn-edit').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const article = data.find(a => a.id === btn.dataset.id);
                        if (article) startEditArticle(article);
                    });
                });

                adminListEl.querySelectorAll('.btn-delete').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        if (!confirm(`Hapus artikel "${btn.dataset.title}"?`)) return;
                        const { error: delErr } = await supabaseClient
                            .from('articles')
                            .delete()
                            .eq('id', btn.dataset.id);

                        if (delErr) {
                            showAlert('Gagal menghapus: ' + delErr.message, 'error');
                        } else {
                            showAlert('Artikel berhasil dihapus.', 'success');
                            loadAdminArticles();
                        }
                    });
                });
            }

            document.getElementById('btn-refresh-list').addEventListener('click', loadAdminArticles);

            // Edit Mode
            const formTitle = document.getElementById('form-title');
            const btnCancelEdit = document.getElementById('btn-cancel-edit');
            const btnSaveArticle = document.getElementById('btn-save-article');

            function startEditArticle(article) {
                idInput.value = article.id;
                titleInput.value = article.title;
                slugInput.value = article.slug;
                document.getElementById('article-category').value = article.category || 'Digital Marketing';
                imageInput.value = article.image_url || '';
                updateImagePreview(article.image_url || '');
                document.getElementById('article-excerpt').value = article.excerpt || '';
                contentArea.value = article.content || '';
                document.getElementById('article-published').checked = !!article.published;

                formTitle.textContent = 'Edit Artikel';
                btnSaveArticle.textContent = '💾 Simpan Perubahan';
                btnCancelEdit.style.display = 'inline-flex';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            function resetArticleForm() {
                document.getElementById('article-form').reset();
                idInput.value = '';
                updateImagePreview('');
                formTitle.textContent = 'Buat Artikel Baru';
                btnSaveArticle.textContent = '🚀 Publish Artikel';
                btnCancelEdit.style.display = 'none';
            }

            btnCancelEdit.addEventListener('click', resetArticleForm);

            // Create / Update Submit
            document.getElementById('article-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!supabaseClient) return;

                const id = idInput.value;
                const payload = {
                    title: titleInput.value.trim(),
                    slug: slugInput.value.trim(),
                    category: document.getElementById('article-category').value.trim(),
                    image_url: imageInput.value.trim() || 'https://images.unsplash.com/photo-1460925895917-afdab827c52f?q=80&w=1000&auto=format&fit=crop',
                    excerpt: document.getElementById('article-excerpt').value.trim(),
                    content: normalizeContentToHtml(contentArea.value),
                    published: document.getElementById('article-published').checked,
                    updated_at: new Date().toISOString()
                };

                btnSaveArticle.disabled = true;
                btnSaveArticle.textContent = 'Menyimpan...';

                let resultError = null;
                if (id) {
                    const { error } = await supabaseClient
                        .from('articles')
                        .update(payload)
                        .eq('id', id);
                    resultError = error;
                } else {
                    const { error } = await supabaseClient
                        .from('articles')
                        .insert([payload]);
                    resultError = error;
                }

                btnSaveArticle.disabled = false;
                btnSaveArticle.textContent = id ? '💾 Simpan Perubahan' : '🚀 Publish Artikel';

                if (resultError) {
                    showAlert('Gagal menyimpan artikel: ' + resultError.message, 'error');
                    return;
                }

                showAlert(id ? 'Artikel berhasil diperbarui!' : 'Artikel baru berhasil dipublish!', 'success');
                resetArticleForm();
                loadAdminArticles();
            });

            checkSession();
        });
    </script>
</body>

</html>
